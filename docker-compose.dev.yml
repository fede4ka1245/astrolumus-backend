services:
  postgres:
    image: postgres:14.12-bullseye
    restart: unless-stopped
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/
      - ./docker/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  analytics-db:
    image: postgres:14.12-bullseye
    restart: unless-stopped
    ports:
      - "127.0.0.1:15434:5432"
    environment:
      - POSTGRES_USER=${ANALYTICS_DB_USER:-analytics}
      - POSTGRES_PASSWORD=${ANALYTICS_DB_PASSWORD:-analytics123}
      - POSTGRES_DB=${ANALYTICS_DB_NAME:-analytics}
    volumes:
      - analytics_data_dev:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2023-01-31T02-24-19Z
    command: server --console-address ":9001" http://minio/data{1...2}
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    hostname: minio
    restart: unless-stopped
    volumes:
      - minio_data1:/data1
      - minio_data2:/data2
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"

  preview-db:
    image: postgres:14.12-bullseye
    restart: unless-stopped
    ports:
      - "127.0.0.1:15433:5432"
    environment:
      - POSTGRES_USER=${PREVIEW_DB_USER}
      - POSTGRES_PASSWORD=${PREVIEW_DB_PASSWORD}
      - POSTGRES_DB=${PREVIEW_DB_NAME}
    volumes:
      - preview_data_dev:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PREVIEW_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  alpha-application:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    working_dir: /code
    volumes:
      - .:/code
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_EXTERNAL_ENDPOINT=minio:9000
    ports:
      - "0.0.0.0:18091:8091"
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput --clear &&
        python manage.py runserver 0.0.0.0:8091
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl http://localhost:8091/ || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  celery:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    working_dir: /code
    volumes:
      - .:/code
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_EXTERNAL_ENDPOINT=minio:9000
      - DB_HOST=postgres
    command: >
      sh -c "
        pip install watchdog -q &&
        watchmedo auto-restart --directory=. --pattern='*.py' --recursive --
        celery -A alpha worker -E -l INFO -P solo
      "
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      alpha-application:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    working_dir: /code
    volumes:
      - .:/code
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_EXTERNAL_ENDPOINT=minio:9000
      - DB_HOST=postgres
    command: >
      sh -c "
        pip install watchdog -q &&
        watchmedo auto-restart --directory=. --pattern='*.py' --recursive --
        celery -A alpha beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
      "
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      alpha-application:
        condition: service_healthy

  app-preview:
    build:
      context: ./app-preview-main
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./app-preview-main:/app
      - app_preview_node_modules:/app/node_modules
      - ./app-preview-main/.env:/app/.env:ro
    ports:
      - "127.0.0.1:13000:3000"
    command: sh -c "npx prisma generate && npx next dev -p 3000"
    depends_on:
      preview-db:
        condition: service_healthy
      alpha-application:
        condition: service_healthy

  tolgee:
    image: tolgee/tolgee:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:18085:8085"
    environment:
      TOLGEE_AUTHENTICATION_ENABLED: "true"
      TOLGEE_AUTHENTICATION_INITIAL_USERNAME: "${TOLGEE_ADMIN_USER:-admin}"
      TOLGEE_AUTHENTICATION_INITIAL_PASSWORD: "${TOLGEE_ADMIN_PASSWORD:-tolgee_admin_2024}"
      TOLGEE_MACHINE_TRANSLATION_ENABLED: "false"
      SERVER_PORT: "8085"
      HEALTHCHECK_PORT: "8085"
    volumes:
      - tolgee_data_dev:/data

  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:13001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${DB_USER}
      MB_DB_PASS: ${DB_PASSWORD}
      MB_DB_HOST: postgres
      MB_EMBEDDING_SECRET_KEY: ${METABASE_SECRET_KEY:-your-metabase-secret-key-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase_data_dev:/metabase-data

volumes:
  postgres_data_dev:
  preview_data_dev:
  redis_dev:
  minio_data1:
  minio_data2:
  tolgee_data_dev:
  analytics_data_dev:
  metabase_data_dev:
  app_preview_node_modules:
