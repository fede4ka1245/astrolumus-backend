server {
    listen 80;
    listen [::]:80;
    server_name backm.alpha-astro.com ;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot/backm.alpha-astro.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backm.alpha-astro.com;

    if ($host !~* ^(backm\.alpha-astro\.ru|backm\.alpha-astro\.com)$ ) {
        return 444;
    }

    include /etc/nginx/ssl/backm.alpha-astro.com.conf;

    ssl_dhparam /etc/nginx/ssl/ssl-dhparams.pem;

    include /etc/nginx/conf.d/includes/options-ssl-nginx.conf;

    include /etc/nginx/conf.d/includes/hsts.conf;

    resolver 127.0.0.11;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    
        # Let Nginx start if upstream host is unreachable
        set $upstream 127.0.0.1:8000;
        proxy_pass http://$upstream;
    
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300;
    }
}
