services:
  postgres:
    image: postgres:14.12-bullseye
    restart: unless-stopped
    expose:
      - 5432
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./docker/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-alpha}" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      replicas: 1
      update_config:
        order: stop-first

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2023-01-31T02-24-19Z
    command: server --console-address ":9001" http://minio/data{1...2}
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    hostname: minio
    restart: unless-stopped
    volumes:
      - data1-1:/data1
      - data1-2:/data2
    ports:
      - "127.0.0.1:19000:9000" # TODO close this
      - "127.0.0.1:19001:9001" # TODO close this

  analytics-db:
    image: postgres:14.12-bullseye
    restart: unless-stopped
    expose:
      - 5432
    ports:
      - "127.0.0.1:15434:5432"
    environment:
      - POSTGRES_USER=${ANALYTICS_DB_USER:-analytics}
      - POSTGRES_PASSWORD=${ANALYTICS_DB_PASSWORD:-analytics123}
      - POSTGRES_DB=${ANALYTICS_DB_NAME:-analytics}
    volumes:
      - analytics_data:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U analytics" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  preview-db:
    image: postgres:14.12-bullseye
    restart: unless-stopped
    expose:
      - 5433
    ports:
      - "127.0.0.1:15433:5432"
    environment:
      - POSTGRES_USER=${PREVIEW_DB_USER:-app_preview}
      - POSTGRES_PASSWORD=${PREVIEW_DB_PASSWORD:-d43skeJSWn7365}
      - POSTGRES_DB=${PREVIEW_DB_NAME:-app_preview}
    volumes:
      - preview_data:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app_preview" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  app-preview:
    build:
      context: ./app-preview-main
      dockerfile: Dockerfile
    image: astrolumus/app-preview:${APP_VERSION:-latest}
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      - BACKEND_URL=${BACKEND_URL}
      - BACKEND_API_TOKEN=${BACKEND_API_TOKEN}
      - NODE_ENV=production
      - BASE_URL=https://app.alpha-astro.com
      - DATABASE_URL=postgresql://${PREVIEW_DB_USER}:${PREVIEW_DB_PASSWORD}@${PREVIEW_DB_HOST}:${PREVIEW_DB_PORT}/${PREVIEW_DB_NAME}?connect_timeout=300
    ports:
      - "127.0.0.1:13000:3000"
    command: "pm2-runtime start npm --name app -- run start -- -p 3000"
    depends_on:
      preview-db:
        condition: service_healthy

  celery:
    restart: unless-stopped
    image: astrolumus/celery:${APP_VERSION:-latest}
    env_file:
      - .env
    build:
      context: .
      dockerfile: .deploy/celery/Dockerfile
    volumes:
      - .:/code
    command: >
      sh -c "
        echo '====== Starting Pre-Deployment Tasks ======' &&
        echo '--- Setting up environment ---' &&
        chmod +x ./setup_env.sh &&
        ./setup_env.sh &&
        echo '--- Running Database Migrations ---' &&
        ./manage.py makemigrations --merge --noinput || true && 
        ./manage.py makemigrations --noinput &&
        ./manage.py migrate --noinput &&
        echo '--- Collecting Static Files ---' &&
        ./manage.py collectstatic --noinput --clear &&
        echo '--- Compiling Translation Messages ---' &&
        ./manage.py compilemessages &&
        echo '====== Pre-Deployment Tasks Completed ======' &&
        celery -A alpha worker -E -l INFO -P solo
      "
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      alpha-application:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_EXTERNAL_ENDPOINT=minio:9000
      - DB_HOST=postgres

  celery-beat:
    restart: unless-stopped
    image: astrolumus/celery-beat:${APP_VERSION:-latest}
    env_file:
      - .env
    build:
      context: .
      dockerfile: .deploy/celery/Dockerfile
    command: >
      sh -c "
        echo '====== Starting Pre-Deployment Tasks ======' &&
        echo '--- Setting up environment ---' &&
        chmod +x ./setup_env.sh &&
        ./setup_env.sh &&
        echo '--- Running Database Migrations ---' &&
        ./manage.py makemigrations --merge --noinput || true && 
        ./manage.py makemigrations --noinput &&
        ./manage.py migrate --noinput &&
        echo '--- Collecting Static Files ---' &&
        ./manage.py collectstatic --noinput --clear &&
        echo '--- Compiling Translation Messages ---' &&
        ./manage.py compilemessages &&
        echo '====== Pre-Deployment Tasks Completed ======' &&
        celery -A alpha beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
      "
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      alpha-application:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_EXTERNAL_ENDPOINT=minio:9000
      - DB_HOST=postgres

  tolgee:
    image: tolgee/tolgee:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:18085:8085"
    environment:
      TOLGEE_AUTHENTICATION_ENABLED: "true"
      TOLGEE_AUTHENTICATION_INITIAL_USERNAME: "${TOLGEE_ADMIN_USER:-admin}"
      TOLGEE_AUTHENTICATION_INITIAL_PASSWORD: "${TOLGEE_ADMIN_PASSWORD:-tolgee_admin_2024}"
      TOLGEE_MACHINE_TRANSLATION_ENABLED: "false"
      SERVER_PORT: "8085"
      HEALTHCHECK_PORT: "8085"
    volumes:
      - tolgee_data:/data

  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:13001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${DB_USER}
      MB_DB_PASS: ${DB_PASSWORD}
      MB_DB_HOST: postgres
      MB_EMBEDDING_SECRET_KEY: ${METABASE_SECRET_KEY:-your-metabase-secret-key-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase-data

  alpha-application:
    restart: unless-stopped
    image: astrolumus/app:${APP_VERSION:-latest}
    expose:
      - 8091
    env_file:
      - .env
    ports:
      - "18091:8091"
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl http://localhost:8091/ || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: >
      sh -c "
        echo '====== Starting Pre-Deployment Tasks ======' &&
        echo '--- Setting up environment ---' &&
        chmod +x ./setup_env.sh &&
        ./setup_env.sh &&
        echo '--- Running Database Migrations ---' &&
        ./manage.py makemigrations --merge --noinput || true && 
        ./manage.py makemigrations --noinput &&
        ./manage.py migrate --noinput &&
        echo '--- Collecting Static Files ---' &&
        ./manage.py collectstatic --noinput --clear &&
        echo '--- Compiling Translation Messages ---' &&
        ./manage.py compilemessages &&
        echo '====== Pre-Deployment Tasks Completed ======' &&
        gunicorn --workers=${APP_WORKERS} --bind 0.0.0.0:8091 --log-level=info alpha.wsgi
      "

volumes:
  nginx_conf_ssl:
  letsencrypt_certs:
  certbot_acme_challenge:
  postgres_data:
  preview_data:
  data1-1:
  data1-2:
  tolgee_data:
  analytics_data:
  metabase_data:
  redis:
